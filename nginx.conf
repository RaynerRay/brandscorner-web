events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 20m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    upstream api_backend     { server api-gateway:8080; }
    upstream user_frontend   { server user-ui:3000; }
    upstream seller_frontend { server seller-ui:3001; }
    upstream admin_frontend  { server admin-ui:3002; }

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name brandscorner.co.zw www.brandscorner.co.zw;

        location /ws-chatting {
            proxy_pass http://chatting-service:6006;
        }

        location /ws-loggers {
            proxy_pass http://logger-service:6008;
        }

        location /gateway-health {
            proxy_pass http://api_backend/gateway-health;
        }

        location /auth/ {
            proxy_pass http://api_backend/auth/;
        }

        location /product/ {
            proxy_pass http://api_backend/product/;
        }

        location /order/ {
            proxy_pass http://api_backend/order/;
        }

        location /seller/ {
            proxy_pass http://api_backend/seller/;
        }

        location /admin/ {
            proxy_pass http://api_backend/admin/;
        }

        location /chatting/ {
            proxy_pass http://api_backend/chatting/;
        }

        location /recommendation/ {
            proxy_pass http://api_backend/recommendation/;
        }

        location / {
            proxy_pass http://user_frontend;
        }
    }

    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name sellers.brandscorner.co.zw;

        location /auth/ {
            proxy_pass http://api_backend/auth/;
        }

        location /seller/ {
            proxy_pass http://api_backend/seller/;
        }

        location /product/ {
            proxy_pass http://api_backend/product/;
        }

        location / {
            proxy_pass http://seller_frontend;
        }
    }

    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name admin.brandscorner.co.zw;

        location /auth/ {
            proxy_pass http://api_backend/auth/;
        }

        location /admin/ {
            proxy_pass http://api_backend/admin/;
        }

        location /product/ {
            proxy_pass http://api_backend/product/;
        }

        location / {
            proxy_pass http://admin_frontend;
        }
    }
}
