name: eshop

x-app: &app
  env_file:
    - .env
  environment:
    NODE_ENV: production
    KAFKA_BROKERS: kafka:29092
  restart: unless-stopped
  pull_policy: build
  depends_on:
    kafka:
      condition: service_healthy

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache openssl >/dev/null
        mkdir -p /etc/nginx/certs
        if [ ! -f /etc/nginx/certs/fullchain.pem ]; then
          openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
            -keyout /etc/nginx/certs/privkey.pem \
            -out /etc/nginx/certs/fullchain.pem \
            -subj "/CN=brandscorner.co.zw"
        fi
        nginx -g "daemon off;"
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --create --if-not-exists --topic user-events --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3
        kafka-topics --create --if-not-exists --topic logs --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3
        kafka-topics --create --if-not-exists --topic chat.new_message --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3
      "
    restart: "no"

  api-gateway:
    <<: *app
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      PORT: 8080

  auth-service:
    <<: *app
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      PORT: 6001

  product-service:
    <<: *app
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      PORT: 6002

  seller-service:
    <<: *app
    build:
      context: .
      dockerfile: apps/seller-service/Dockerfile
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      PORT: 6003

  order-service:
    <<: *app
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      PORT: 6004

  admin-service:
    <<: *app
    build:
      context: .
      dockerfile: apps/admin-service/Dockerfile
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      PORT: 6005

  chatting-service:
    <<: *app
    build:
      context: .
      dockerfile: apps/chatting-service/Dockerfile
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      PORT: 6006
      DOCKER_ENV: "true"

  kafka-service:
    <<: *app
    build:
      context: .
      dockerfile: apps/kafka-service/Dockerfile
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      DOCKER_ENV: "true"

  logger-service:
    <<: *app
    build:
      context: .
      dockerfile: apps/logger-service/Dockerfile
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      PORT: 6008
      DOCKER_ENV: "true"

  recommendation-service:
    <<: *app
    build:
      context: .
      dockerfile: apps/recommendation-service/Dockerfile
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      PORT: 6007

  user-ui:
    build:
      context: .
      dockerfile: apps/user-ui/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
    pull_policy: build

  seller-ui:
    build:
      context: .
      dockerfile: apps/seller-ui/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    restart: unless-stopped
    pull_policy: build

  admin-ui:
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002
    restart: unless-stopped
    pull_policy: build

networks:
  default:
    name: eshop-network
