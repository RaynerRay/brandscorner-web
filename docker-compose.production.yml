name: eshop

x-app: &app
  env_file:
    - .env
  restart: unless-stopped
  pull_policy: never

services:
  # Load Balancer (Nginx)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    depends_on:
      - api-gateway
      - user-ui
      - seller-ui
      - admin-ui
    restart: unless-stopped

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.2"

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

  # Kafka Topic Creator
  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    command: |
      bash -c '
        echo "Creating Kafka topics..."
        kafka-topics --create --topic user-events --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3
        kafka-topics --create --topic logs --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3
        kafka-topics --create --topic chat.new_message --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3
        echo "Topics created successfully!"
      '
    restart: "no"

  # API Gateway
  api-gateway:
    <<: *app
    image: brandscorner/api-gateway:latest
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/gateway-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  # Auth Service
  auth-service:
    <<: *app
    image: brandscorner/auth-service:latest
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6001/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  # Product Service
  product-service:
    <<: *app
    image: brandscorner/product-service:latest
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  # Order Service
  order-service:
    <<: *app
    image: brandscorner/order-service:latest
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  # Seller Service
  seller-service:
    <<: *app
    image: brandscorner/seller-service:latest
    build:
      context: .
      dockerfile: apps/seller-service/Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  # Admin Service
  admin-service:
    <<: *app
    image: brandscorner/admin-service:latest
    build:
      context: .
      dockerfile: apps/admin-service/Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  # Chatting Service
  chatting-service:
    <<: *app
    image: brandscorner/chatting-service:latest
    build:
      context: .
      dockerfile: apps/chatting-service/Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  # Kafka consumer worker
  kafka-service:
    <<: *app
    image: brandscorner/kafka-service:latest
    build:
      context: .
      dockerfile: apps/kafka-service/Dockerfile
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Logger Service
  logger-service:
    <<: *app
    image: brandscorner/logger-service:latest
    build:
      context: .
      dockerfile: apps/logger-service/Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  # Recommendation Service
  recommendation-service:
    <<: *app
    image: brandscorner/recommendation-service:latest
    build:
      context: .
      dockerfile: apps/recommendation-service/Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  # User UI
  user-ui:
    <<: *app
    image: brandscorner/user-ui:latest
    build:
      context: .
      dockerfile: apps/user-ui/Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URI=https://brandscorner.co.zw
      - NEXT_PUBLIC_CHATTING_WEBSOCKET_URI=wss://brandscorner.co.zw/ws-chatting
      - NEXT_PUBLIC_SELLER_SERVER_URI=https://sellers.brandscorner.co.zw
      - NEXT_PUBLIC_STRIPE_PUBLIC_KEY=pk_test_51Ox7STKfWK4AoG4YmNVlSSToDlYzvr8TGe2d36vzYt5iYQ4JViRC976MOF9A2uXU2wzJt4T2IN5NXscnmpGlXlAz00whmGYvmP
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  # Seller UI
  seller-ui:
    <<: *app
    image: brandscorner/seller-ui:latest
    build:
      context: .
      dockerfile: apps/seller-ui/Dockerfile
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

  # Admin UI
  admin-ui:
    <<: *app
    image: brandscorner/admin-ui:latest
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"

networks:
  default:
    name: eshop-network
